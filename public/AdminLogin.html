<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlogPatrol - Admin Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/AdminLogin.css">
</head>
<body>
    <!-- Main Content -->
    <div id="content">
        <div data-role-header="admin" data-logout-mode="never"></div>
    <script src="/js/roleHeaders.js"></script>
        
        <!-- Login Form Section -->
        <div class="login-container">
            <form name="personalinformationForm" method="post" action="/AdminMain">
                <center> <h1> Hello Admin!!</h1> </center>
                <label>Username : </label>   
                <input type="text" placeholder="Enter Username" name="a_id" required>  
                <label>Password : </label>   
                <input type="password" placeholder="Enter Password" name="a_password" required>  
                <button type="submit">Login</button>

                <div class="two-col">
                    <div class="two">
                        <a href="#">Forgot password? </a>
                    </div>
                </div>
            </form> <!-- Moved the closing </form> tag here -->
        </div>

        <!-- Footer Section -->
        <div data-role-footer="admin"></div>
    <script src="/js/roleFooters.js"></script>
        
    </div>
</body>
</html>
