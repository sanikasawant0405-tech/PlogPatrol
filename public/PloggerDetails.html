<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlogPatrol - Plogger Details</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/AdminLogin.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
        }

        .table-container {
            margin: 20px auto 60px;
            margin-top: 100px;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 90%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #4e97f1e7;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Styles for the status column */
        .status-column {
            font-weight: bold; 
        }

        .status-active {
            color: green;
        }

        .status-inactive {
            color: red;
        }
    </style>
</head>
<body>

    <!-- Main Content Wrapper -->
    <div id="content">
        <!-- Dashboard Section -->
        <div data-role-header="admin" data-logout-mode="auto"></div>
    <script src="/js/roleHeaders.js"></script>

        <!-- Plogger Details Table -->
        <div class="table-container">
           <center><h1>All Plogger Details</h1></center> <br>
            <table>
                <thead>
                    <tr>
                        <th>Serial No</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Mobile No</th>
                        <th>Address</th>
                        <th>Email ID</th>
                        <th>Gender</th>
                        <th>Date of Birth</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be dynamically loaded here -->
                </tbody>
            </table>
        </div>

        <!-- Footer Section -->
        <div data-role-footer="admin"></div>
    <script src="/js/roleFooters.js"></script>
    </div>

    <!-- JavaScript to dynamically load data into the table -->
    <script>
        // Fetch plogger details from the server
        fetch('/PloggerDetails')
            .then(response => response.json())
            .then(data => {
                // Get the table body
                const tableBody = document.querySelector('tbody');

                // Clear any existing rows
                tableBody.innerHTML = '';

                // Loop through the plogger details and add them as rows in the table
                data.forEach(plogger => {
                    // Create a new table row
                    const row = document.createElement('tr');

                    // Insert table data for each column
                    row.innerHTML = `
                        <td>${plogger.u_srno}</td>
                        <td>${plogger.u_name}</td>
                        <td>${plogger.u_age}</td>
                        <td>${plogger.u_mobno}</td>
                        <td>${plogger.u_address}</td>
                        <td>${plogger.u_mailid}</td>
                        <td>${plogger.u_gender}</td>
                        <td>${plogger.u_dob}</td>
                    `;

                    // Status column
                    const statusCell = document.createElement('td');
                    statusCell.classList.add('status-column');

                    if (plogger.has_personal_info) {
                        statusCell.classList.add('status-active');
                        statusCell.textContent = 'Profile Complete';
                    } else {
                        statusCell.classList.add('status-inactive');
                        statusCell.textContent = 'Pending Profile';
                    }

                    // Append status cell to the row
                    row.appendChild(statusCell);

                    // Append the row to the table body
                    tableBody.appendChild(row);
                });
            })
            .catch(error => console.error('Error fetching plogger details:', error));
    </script>
</body>
</html>
